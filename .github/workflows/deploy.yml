# Adelux React - CI/CD Pipeline
# Este pipeline se activa automáticamente cuando haces git push a la rama main.
# Construye la aplicación React y la despliega en GitHub Pages.

name: Deploy Adelux to GitHub Pages

on:
  # Se ejecuta cuando hay push a la rama main
  push:
    branches: ['main']

  # Permite ejecutar manualmente desde la pestaña Actions
  workflow_dispatch:

# Permisos necesarios para GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Solo permite un despliegue a la vez
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Job 1: Construir la aplicación
  build:
    runs-on: ubuntu-latest
    steps:
      # Paso 1: Descargar el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # Paso 2: Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Paso 3: Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # Paso 4: Construir la aplicación para producción
      - name: Build application
        run: npm run build

      # Paso 5: Configurar GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Paso 6: Subir los archivos construidos
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Job 2: Desplegar a GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Paso final: Desplegar
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
